<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
  <style>
    body { background-color: #f3f4f5; padding: 40px; }
    h1 { margin-bottom: 30px !important; text-align: center; }
    .ui.cards { justify-content: center; }
  </style>
</head>

<body>
  <div id="app" class="ui container">
    <h1>Профили GitHub</h1>
    
    <div class="ui cards">
      <github-user-card 
        v-for="username in usernames" 
        :key="username" 
        :username="username">
      </github-user-card>
    </div>
  </div>

  <script type="text/x-template" id="github-user-card-template">
    <div class="ui card">
      <div class="image">
        <img :src="user.avatar_url">
      </div>
      <div class="content">
        <a :href="user.html_url" target="_blank" class="header">{{ user.name || username }}</a>
        <div class="meta">
          <span class="date">В GitHub с {{ formattedDate }}</span>
        </div>
        <div class="description">
          {{ user.bio || 'Пользователь еще не заполнил биографию.' }}
        </div>
      </div>
      <div class="extra content">
        <a :href="`https://github.com/${username}?tab=followers`" target="_blank">
          <i class="user icon"></i>
          Подписчиков: {{ user.followers }}
        </a>
      </div>
    </div>
  </script>

  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          usernames: ['enderc00l', 'orsoniks', 'itseniy', 'fracix', 'TheOneWhoBuilds1']
        }
      }
    })

    app.component('github-user-card', {
      template: '#github-user-card-template',
      props: {
        username: { type: String, required: true }
      },
      data() {
        return {
          user: {}
        }
      },
      computed: {
        formattedDate() {
          if (!this.user.created_at) return '';
          const date = new Date(this.user.created_at);
          return date.toLocaleDateString('ru-RU', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
        }
      },
      async created() {
        try {
          const response = await axios.get(`https://api.github.com/users/${this.username}`);
          this.user = response.data;
        } catch (error) {
          console.error("Ошибка API:", error);
        }
      }
    })

    app.mount('#app')
  </script>
</body>
</html>
